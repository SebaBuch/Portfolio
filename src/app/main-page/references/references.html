<section class="references">
    <h3>{{ languageService.translate('referencesTitle') }}</h3>

    <div class="ref-track {{ moveClass() }}">
        @for (offset of offsets; track offset) {
        @let reference = references[getIndexAt(offset)];
        <div class="ref-card pos-{{ $index }}">
            <img class="quote" src="/icons/quotes.svg" alt="">
            <p class="ref-text">{{ languageService.translate(reference.textKey) }}</p>
            <p class="ref-author">{{ reference.author }}</p>
        </div>
        }
    </div>

    <div class="ref-controls">
        <button class="arrow-btn arrow-left" (click)="showPrevious()" aria-label="Vorherige Referenz"></button>
        <div class="dots">
            @for (reference of references; track $index; let i = $index) {
            <button class="dot" [class.active]="i === currentIndex()" (click)="showReference(i)"
                aria-label="Referenz anzeigen"></button>
            }
        </div>
        <button class="arrow-btn arrow-right" (click)="showNext()" aria-label="Nächste Referenz"></button>
    </div>
</section>
